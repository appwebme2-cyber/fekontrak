server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Kompres teks (JS, CSS, JSON, SVG) sebelum dikirim: file JS utama ~489 KB menjadi ~150 KB
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml text/xml;

    # File hasil build Vite (/assets/*) namanya berisi hash dan berganti setiap deploy,
    # jadi aman disimpan browser selamanya. File yang tidak ada dijawab 404 (bukan index.html)
    # supaya aplikasi bisa mendeteksi chunk lama setelah deploy lalu memuat ulang.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html selalu dicek ulang ke server, supaya deploy baru langsung terpakai
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
